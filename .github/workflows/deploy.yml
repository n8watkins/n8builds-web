# Builds the site with OpenNext and deploys it to Cloudflare Workers (see
# DEPLOY.md). The build always runs; the deploy step skips with a notice until
# the CLOUDFLARE_API_TOKEN repository secret exists.
name: Deploy

on:
  push:
    branches: [main]
    # Docs-only changes can't change the site (the same rule as CI's).
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    # Only the upstream repo deploys; a fork has no Worker to deploy to.
    if: github.repository == 'n8watkins/n8builds-web'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Inlined into the pages at build time. All public (they ship in every
      # page); the Web Analytics token is a repository variable (DEPLOY.md).
      NEXT_PUBLIC_SITE_URL: https://n8builds.dev
      NEXT_PUBLIC_SANITY_PROJECT_ID: abgyc32w
      NEXT_PUBLIC_GA_ID: G-JZQGKY9Q37
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAADog7ERSblVox21J
      NEXT_PUBLIC_SENTRY_DSN: https://7e41d848c6abae7aaf931bd7fa5049e1@o4507767562371072.ingest.us.sentry.io/4511629733855232
      NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ vars.NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN }}
      # The build log, stars and downloads are read from GitHub at build time.
      GITHUB_TOKEN: ${{ github.token }}
      # Optional: uploads source maps to Sentry.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:worker

      - name: Waiting for setup
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Built, but skipping the deploy until the CLOUDFLARE_API_TOKEN secret is added (DEPLOY.md)."

      # New D1 migrations land before the Worker that needs them
      # (docs/DATABASE.md). Needs the token's "D1: Edit" permission, so it runs
      # once the repository variable D1_MIGRATE is 1; until then they are
      # applied by hand (npm run db:migrate) before merging.
      - name: Apply database migrations
        if: env.CLOUDFLARE_API_TOKEN != '' && vars.D1_MIGRATE == '1'
        run: npm run db:migrate

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx opennextjs-cloudflare deploy

      # The live home page loads with no console errors or uncaught exceptions
      # (tests/e2e/pages.spec.ts against n8builds.dev). CI's own runs use
      # `next start`, which never sees the Worker bundle; this sees what
      # visitors get.
      - name: Install Chromium
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx playwright install --with-deps chromium

      - name: Live home page has no console errors
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          E2E_REMOTE_URL: https://n8builds.dev
        run: npx playwright test tests/e2e/pages.spec.ts --project=chromium --grep " / renders without errors" --reporter=github
