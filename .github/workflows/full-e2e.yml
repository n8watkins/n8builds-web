name: Full E2E on label

# Labelling a pull request full-e2e runs every Playwright test on every browser
# on it now, by starting CI ("Run workflow" with `full` ticked) on its branch:
# that run's checks land on the pull request's head commit. Later pushes see
# the label themselves (ci.yml). Only this label starts anything, so other
# labels never restart CI. A fork's branch can't be started from here: use
# "Run workflow" by hand there.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  start:
    name: Start full CI
    if: github.event.label.name == 'full-e2e' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # start ci.yml
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f full=true
