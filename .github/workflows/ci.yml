name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release train starts CI on its release commit this way (pushes made
  # with GITHUB_TOKEN start no workflows). With no base to diff against, the
  # "What changed" job runs everything.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes can be cancelled; every commit on main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only changes (Markdown, docs/, the license) skip the browser suite and
  # Lighthouse: nothing they test can change. Lint, types, unit tests and the
  # commit-message check still run. Workflow changes always run everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Without a usable base (a new branch, a force push), run everything.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "$HEAD_SHA")
          echo "$files"
          code_files=$(echo "$files" | grep -vE '^(docs/.*|.*\.md|LICENSE)$' || true)
          if [ -n "$code_files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docs-only change: browser tests and Lighthouse skipped."
          fi
      # The E2E container must match the installed Playwright exactly, so a
      # Playwright upgrade moves CI to its image by itself.
      - id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:unit

  # Every Playwright project as its own parallel job. Each job builds the app
  # itself in test mode (playwright.config.ts webServer), so the test env is
  # defined in one place. The repo is public, so these minutes are free.
  e2e:
    name: E2E (${{ matrix.project }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Playwright's image has every browser and the libraries they need, so no
    # job waits on Ubuntu's package mirrors (on 2026-10-25 they crawled at
    # about 100 KB/s and held installs for 10 to 20 minutes).
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
      options: --ipc=host
    env:
      # Firefox refuses to start when HOME belongs to another user (the container runs as root).
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: api }
          - { project: chromium }
          - { project: firefox }
          # The WebKit projects are the slowest, and with two workers they
          # overloaded the runner and timed out at random on main. Each runs
          # as two parallel halves with one worker, so it stays as fast and
          # stops competing with itself for CPU.
          - { project: webkit, shard: 1/2, workers: 1 }
          - { project: webkit, shard: 2/2, workers: 1 }
          - { project: mobile-chrome }
          - { project: mobile-safari, shard: 1/2, workers: 1 }
          - { project: mobile-safari, shard: 2/2, workers: 1 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright test --project=${{ matrix.project }} ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }} ${{ matrix.workers && format('--workers={0}', matrix.workers) || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}${{ matrix.shard && format('-{0}', strategy.job-index) || '' }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Same test-mode build as the E2E suite: no email, analytics or Sentry.
      CONTACT_TEST_MODE: '1'
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      NEXT_PUBLIC_SITE_URL: https://n8builds.dev
      NEXT_PUBLIC_SANITY_PROJECT_ID: abgyc32w
      # The build log audits against its recorded GitHub fixture.
      BUILD_LOG_FIXTURE: '1'
      LIGHTHOUSE_PORT: '3747'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # 3 runs per page; fails on the median against the budgets in
      # scripts/lighthouse.mjs.
      - run: npm run lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouse/
          include-hidden-files: true
          retention-days: 14

  # The one check branch protection requires. It passes when every job above
  # passed or was skipped on purpose (a docs-only change), and fails if any
  # failed or was cancelled. Requiring the matrix jobs by name instead would
  # block docs-only PRs forever, because skipped matrix jobs never report.
  result:
    name: CI result
    if: always()
    needs: [changes, checks, e2e, lighthouse]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a CI job ended as $result"; exit 1 ;;
            esac
          done
