name: Nightly

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-all-browsers:
    name: E2E (all browsers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:e2e:all
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
