name: Nightly

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-repos:
    name: Build log repos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Reports each tracked repo's latest release, release-kit adoption and
      # commit-check pass rate; fails only when a repo can't be read. With the
      # BUILD_LOG_GITHUB_TOKEN secret set (the same token as Vercel's
      # GITHUB_TOKEN), it also catches that token expiring.
      - run: node scripts/check-build-repos.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.BUILD_LOG_GITHUB_TOKEN || github.token }}

  e2e-all-browsers:
    name: E2E (all browsers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Same stall guard as ci.yml, with room for all three browsers.
      - name: Install the browsers
        timeout-minutes: 19
        run: |
          # apt waits out slow mirrors and a lock left by a killed try.
          sudo tee /etc/apt/apt.conf.d/80-ci-retries > /dev/null <<'EOF'
          Acquire::Retries "5";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          DPkg::Lock::Timeout "180";
          EOF
          for try in 1 2 3; do
            timeout 360 npx playwright install --with-deps && exit 0
            echo "::warning::playwright install try $try failed or stalled; retrying"
          done
          exit 1
      - run: npm run test:e2e:all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Same test-mode build as the E2E suite: no email, analytics or Sentry.
      CONTACT_TEST_MODE: '1'
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      NEXT_PUBLIC_SITE_URL: https://n8builds.dev
      NEXT_PUBLIC_SANITY_PROJECT_ID: abgyc32w
      # The build log audits against its recorded GitHub fixture.
      BUILD_LOG_FIXTURE: '1'
      LIGHTHOUSE_PORT: '3747'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # 3 runs per page; fails on the median against the budgets in
      # scripts/lighthouse.mjs.
      - run: npm run lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouse/
          # upload-artifact v4 skips dot-directories unless told otherwise.
          include-hidden-files: true
          retention-days: 14
