name: Nightly

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-repos:
    name: Build log repos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The commit check comes from the release-kit dev dependency.
      - run: npm ci
      # Reports each tracked repo's latest release, release-kit adoption and
      # commit-check pass rate; fails only when a repo can't be read. With the
      # BUILD_LOG_GITHUB_TOKEN secret set (the same token as Vercel's
      # GITHUB_TOKEN), it also catches that token expiring.
      - run: node scripts/check-build-repos.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.BUILD_LOG_GITHUB_TOKEN || github.token }}

  # The full CI on main's current commit: every browser (sharded like the
  # pull request checks, so it fits in its time limits) and Lighthouse. This
  # replaced a single all-browsers E2E job that ran 2,500 tests on two
  # workers and hit its 45-minute limit every night.
  ci:
    name: Full CI
    uses: ./.github/workflows/ci.yml
